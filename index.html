<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GanaFácil</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #06110b;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      text-align: center;
      margin: 30px 0;
    }

    .logo span {
      color: #39e879;
    }

    .card {
      background: #0b1b12;
      border: 1px solid #1d3c29;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input {
      background: #07140d;
      border: 1px solid #294936;
      color: white;
    }

    button {
      background: #39e879;
      border: none;
      color: #041008;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #173622;
      color: white;
    }

    .balance {
      font-size: 38px;
      font-weight: bold;
      color: #39e879;
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }

    .muted {
      color: #91a79a;
      font-size: 14px;
    }

    .message {
      padding: 10px;
      background: #11251a;
      border-radius: 10px;
      margin-top: 10px;
    }

    .task {
      border-top: 1px solid #1d3c29;
      padding: 15px 0;
    }

    .task:first-child {
      border-top: none;
    }

    .task button {
      width: auto;
      padding: 10px 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .green {
      color: #39e879;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    Gana<span>Fácil</span>
  </div>

  <!-- LOGIN -->

  <section id="auth">

    <div id="loginBox" class="card">

      <h2>Iniciar sesión</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Contraseña"
      >

      <button id="loginButton">
        Entrar
      </button>

      <button
        class="secondary"
        id="showRegisterButton"
      >
        Crear cuenta
      </button>

      <div
        id="loginMessage"
        class="message hidden"
      ></div>

    </div>


    <!-- REGISTRO -->

    <div
      id="registerBox"
      class="card hidden"
    >

      <h2>Crear cuenta</h2>

      <input
        id="registerName"
        type="text"
        placeholder="Nombre"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Contraseña"
      >

      <input
        id="referralCode"
        type="text"
        placeholder="Código de referido (opcional)"
      >

      <button id="registerButton">
        Registrarme
      </button>

      <button
        class="secondary"
        id="showLoginButton"
      >
        Ya tengo una cuenta
      </button>

      <div
        id="registerMessage"
        class="message hidden"
      ></div>

    </div>

  </section>


  <!-- APLICACIÓN -->

  <section
    id="app"
    class="hidden"
  >

    <div class="card">

      <div class="muted">
        Saldo disponible
      </div>

      <div
        id="balance"
        class="balance"
      >
        $0
      </div>

      <div
        id="userName"
        class="muted"
      ></div>

    </div>


    <!-- TAREAS -->

    <div class="card">

      <div class="row">

        <h2>
          Tareas disponibles
        </h2>

        <button
          id="refreshButton"
          style="width:auto"
        >
          Actualizar
        </button>

      </div>

      <div id="tasks">
        Cargando tareas...
      </div>

    </div>


    <!-- PERFIL -->

    <div class="card">

      <h2>
        Mi perfil
      </h2>

      <div id="profile">
        Cargando...
      </div>

      <button
        class="secondary"
        id="logoutButton"
      >
        Cerrar sesión
      </button>

    </div>

  </section>

</div>


<!-- SUPABASE -->

<script type="module">

  import {
    createClient
  } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  /*
    SUPABASE
  */

  const SUPABASE_URL =
    "https://vvcuvkdtkqmnbuujhpll.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_nFTz3WBpZ0b68QdPAB1BxQ_uHL5UM0f";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
    ELEMENTOS
  */

  const loginBox =
    document.getElementById("loginBox");

  const registerBox =
    document.getElementById("registerBox");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const registerName =
    document.getElementById("registerName");

  const registerEmail =
    document.getElementById("registerEmail");

  const registerPassword =
    document.getElementById("registerPassword");

  const referralCode =
    document.getElementById("referralCode");

  const loginMessage =
    document.getElementById("loginMessage");

  const registerMessage =
    document.getElementById("registerMessage");

  const app =
    document.getElementById("app");

  const auth =
    document.getElementById("auth");

  const balance =
    document.getElementById("balance");

  const userName =
    document.getElementById("userName");

  const profile =
    document.getElementById("profile");

  const tasks =
    document.getElementById("tasks");


  /*
    FUNCIONES
  */

  function showMessage(
    element,
    message
  ) {

    element.textContent =
      message;

    element.classList.remove(
      "hidden"
    );

  }


  function money(
    value
  ) {

    return "$" +
      Number(
        value || 0
      ).toLocaleString(
        "es-CO"
      );

  }


  /*
    CAMBIAR A REGISTRO
  */

  document
    .getElementById(
      "showRegisterButton"
    )
    .onclick = function() {

      loginBox.classList.add(
        "hidden"
      );

      registerBox.classList.remove(
        "hidden"
      );

    };


  /*
    CAMBIAR A LOGIN
  */

  document
    .getElementById(
      "showLoginButton"
    )
    .onclick = function() {

      registerBox.classList.add(
        "hidden"
      );

      loginBox.classList.remove(
        "hidden"
      );

    };


  /*
    REGISTRO
  */

  document
    .getElementById(
      "registerButton"
    )
    .onclick = async function() {

      const name =
        registerName.value.trim();

      const email =
        registerEmail.value.trim();

      const password =
        registerPassword.value;

      const referral =
        referralCode.value.trim();


      if (
        !name ||
        !email ||
        !password
      ) {

        showMessage(
          registerMessage,
          "Completa nombre, correo y contraseña."
        );

        return;

      }


      const {
        data,
        error
      } =
      await supabase.auth.signUp({

        email: email,

        password: password,

        options: {

          /*
            ENLACE PÚBLICO DE GANAFÁCIL
          */

          emailRedirectTo:
            "https://subtle-entremet-bb5d19.netlify.app",

          data: {

            Nombre: name,

            nombre: name,

            codigo_referido:
              referral || null

          }

        }

      });


      if (error) {

        showMessage(
          registerMessage,
          error.message
        );

        return;

      }


      if (data.session) {

        showMessage(
          registerMessage,
          "Cuenta creada correctamente."
        );

        await loadApplication();

      } else {

        showMessage(
          registerMessage,
          "Cuenta creada. Revisa tu correo y confirma tu cuenta."
        );

      }

    };


  /*
    LOGIN
  */

  document
    .getElementById(
      "loginButton"
    )
    .onclick = async function() {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;


      if (
        !email ||
        !password
      ) {

        showMessage(
          loginMessage,
          "Escribe tu correo y contraseña."
        );

        return;

      }


      const {
        error
      } =
      await supabase.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        showMessage(
          loginMessage,
          error.message
        );

        return;

      }


      await loadApplication();

    };


  /*
    CARGAR APLICACIÓN
  */

  async function loadApplication() {

    const {
      data: {
        user
      }
    } =
    await supabase.auth.getUser();


    if (!user) {
      return;
    }


    auth.classList.add(
      "hidden"
    );

    app.classList.remove(
      "hidden"
    );


    await loadProfile(
      user.id
    );

    await loadTasks();

  }


  /*
    PERFIL
  */

  async function loadProfile(
    userId
  ) {

    const {
      data,
      error
    } =
    await supabase
      .from("Perfiles")
      .select("*")
      .eq("Id", userId)
      .maybeSingle();


    if (error) {

      profile.textContent =
        "Error cargando perfil: " +
        error.message;

      return;

    }


    if (!data) {

      profile.textContent =
        "El perfil todavía no existe.";

      return;

    }


    balance.textContent =
      money(data.Saldo);


    userName.textContent =
      data.Nombre || "";


    profile.innerHTML =

      "<p><strong>Nombre:</strong> " +
      (data.Nombre || "") +
      "</p>" +

      "<p><strong>Correo:</strong> " +
      (data.Email || "") +
      "</p>" +

      "<p><strong>Código de referido:</strong> " +
      (data.Codigo_referido || "") +
      "</p>" +

      "<p><strong>Total de referidos:</strong> " +
      (data.Total_referidos || 0) +
      "</p>" +

      "<p><strong>Ganancias totales:</strong> " +
      money(data.Ganancias_totales) +
      "</p>";

  }


  /*
    TAREAS
  */

  async function loadTasks() {

    tasks.textContent =
      "Cargando tareas...";


    const {
      data,
      error
    } =
    await supabase
      .from("Tareas")
      .select(
        "Id,Titulo,Descripción,Recompensa,Url,Tipo,Estado"
      )
      .order(
        "Recompensa",
        {
          ascending: false
        }
      );


    if (error) {

      tasks.textContent =
        "Error cargando tareas: " +
        error.message;

      return;

    }


    const available =
      (data || []).filter(
        function(task) {

          if (!task.Estado) {
            return true;
          }

          return (
            String(
              task.Estado
            ).toLowerCase()
            === "activa"
            ||
            String(
              task.Estado
            ).toLowerCase()
            === "activo"
          );

        }
      );


    if (
      available.length === 0
    ) {

      tasks.textContent =
        "No hay tareas disponibles.";

      return;

    }


    tasks.innerHTML = "";


    available.forEach(
      function(task) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "task";


        div.innerHTML =

          "<strong>" +
          task.Titulo +
          "</strong>" +

          "<div class='muted'>" +
          (task.Descripción || "") +
          "</div>" +

          "<div class='green'>" +
          "+" +
          money(
            task.Recompensa
          ) +
          "</div>" +

          "<button>Completar tarea</button>";


        const button =
          div.querySelector(
            "button"
          );


        button.onclick =
          function() {

            completeTask(
              task,
              button
            );

          };


        tasks.appendChild(
          div
        );

      }
    );

  }


  /*
    COMPLETAR TAREA
  */

  async function completeTask(
    task,
    button
  ) {

    const {
      data: {
        user
      }
    } =
    await supabase.auth.getUser();


    if (!user) {
      return;
    }


    button.disabled =
      true;


    button.textContent =
      "Guardando...";


    const {
      error
    } =
    await supabase
      .from("Completadas")
      .insert({

        usuario_id:
          user.id,

        Tarea_id:
          task.Id

      });


    if (error) {

      alert(
        "No se pudo completar la tarea: " +
        error.message
      );


      button.disabled =
        false;

      button.textContent =
        "Completar tarea";

      return;

    }


    alert(
      "Tarea registrada correctamente."
    );


    await loadProfile(
      user.id
    );


    await loadTasks();

  }


  /*
    ACTUALIZAR
  */

  document
    .getElementById(
      "refreshButton"
    )
    .onclick = async function() {

      const {
        data: {
          user
        }
      } =
      await supabase.auth.getUser();


      if (user) {

        await loadProfile(
          user.id
        );

        await loadTasks();

      }

    };


  /*
    CERRAR SESIÓN
  */

  document
    .getElementById(
      "logoutButton"
    )
    .onclick = async function() {

      await supabase.auth.signOut();

      location.reload();

    };


  /*
    SESIÓN
  */

  supabase.auth.onAuthStateChange(
    function(
      event,
      session
    ) {

      if (session) {

        setTimeout(
          loadApplication,
          0
        );

      }

    }
  );


  const {
    data: {
      session
    }
  } =
  await supabase.auth.getSession();


  if (session) {

    await loadApplication();

  }

</script>

</body>
</html>
